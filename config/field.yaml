# RoboField configuration — reference build
field:
  width_mm: 1000
  height_mm: 1000
  wall_height_mm: 100        # above the playing surface
  wall_thickness_mm: 10
  tile_size_mm: 250          # 4 x 4 printed tiles, 12 mm thick

markers:
  dictionary: DICT_4X4_50
  # Tower marker centres [x, y, z] in field mm (origin = inner bottom-left field corner).
  # Towers stand outside the walls at different heights so the camera pose is well constrained.
  corners:
    0: [-71, -71, 220]     # T3 (bottom-left)
    1: [1071, -71, 260]    # T4 (bottom-right)
    2: [1071, 1071, 180]   # T2 (top-right)
    3: [-71, 1071, 140]    # T1 (top-left)
  corner_size_mm: 80
  robot_size_mm: 40        # consider 40 mm with the Pi Camera 3 Wide (see docs/vision.md)
  object_size_mm: 35
  robot_id_offset: 10        # robot N uses marker 10 + N
  object_id_min: 30          # markers from this id on are objects (boxes, pucks), not robots

camera:
  index: 0
  width: 2304
  height: 1296
  fps: 56
  fourcc: MJPG
  autofocus: false
  focus: 0                   # tune once, then keep fixed
  calibration_file: calibration/camera.npz   # optional, from tools/calibrate_camera.py
  height_mm: 1300            # lens height above the field surface
  model: pi_camera_3_wide    # 120 deg diagonal; capture on a Raspberry Pi (picamera2)

vision:
  estimator: plane           # plane (recommended) | pnp | homography (flat corners only)
  robot_marker_height_mm: 84 # top of car above the field surface
  object_marker_height_mm: 41 # marker on top of an object (ids from markers.object_id_min): a 40 mm box
  corner_refinement: subpix

comm:
  port: /dev/ttyUSB0         # Windows: COM3
  baud: 921600
  rate_hz: 50

robots:
  - id: 0
    name: car-0
    max_speed_mm_s: 330
    # This car's physical left/right wheels are swapped relative to what the kinematics model
    # (and the simulator) call "left" and "right": commanding a turn rate produced the opposite
    # physical rotation, confirmed on the real car 2026-11-05, while straight-line forward/backward
    # driving was correct. RealBackend swaps the two radio command fields for any robot with this
    # flag set, so DiffDrive / the controllers / the simulator stay untouched and sim-correct.
    wheels_swapped: true

# Robot model, shared by the simulator, the controllers and the RL environments.
# Differential drive: 2 staggered N20 wheels near the middle + 1 front ball caster.
# The robot's pose (x, y, theta) is the point midway between the wheels (the ArUco marker sits
# right above it), theta along the driving direction.
robot_model:
  length_mm: 70
  width_mm: 50
  height_mm: 45              # marker plane
  mass_g: 220
  wheel_radius_mm: 16.5     # measured: 3.3 cm wheel diameter
  wheel_width_mm: 8
  track_mm: 56               # measured: distance between the two wheel centres
  axle_offset_mm: -17        # axle position along the body, from the body centre (negative = rear)
  caster_offset_mm: 25       # caster position along the body, from the body centre (front)
  caster_radius_mm: 5
  max_wheel_rpm: 197         # top of the measured speed_curve below (340 mm/s on a 16.5 mm wheel)
  stall_torque_nm: 0.065     # per motor (at 2S); DC motor model: torque = stall * (duty - speed / no-load speed)
  # Dead zone the LAPTOP compensates: zero, because the car's firmware already lifts every
  # non-zero command above each wheel's own dead zone (LEFT_DEADZONE 0.26 / RIGHT_DEADZONE 0.20 in
  # robofield_car/config.h). Compensating here too made the smallest correction ~30% motor power.
  deadzone: 0.0
  deadzone_left: 0.0
  deadzone_right: 0.0
  # Measured on the real car 2026-11-06 (tools/calibrate_motors.py): with equal commands the left
  # wheel ran ~8% faster (259 vs 239 mm/s), curving with a ~0.6 m radius.
  trim_left: 0.923
  trim_right: 1.0
  # Measured straight-line speed (mm/s) per command, same date. Very non-linear: the firmware's
  # dead-zone floor sits above where these motors actually start, so the smallest command already
  # drives ~100 mm/s. Every controller maps its speed requests through this curve.
  speed_curve: [[0.0, 0], [0.001, 100], [0.03, 116], [0.08, 152], [0.15, 185], [0.25, 200], [0.35, 255], [0.5, 282], [1.0, 340]]
  wheel_accel_limit_mm_s2: 2000   # firmware DUTY_RAMP_PER_S 6.0 x 340 mm/s top speed

control:
  rate_hz: 30                # decision / command rate for every backend
  latency_s: 0.20            # command -> wheels move -> camera -> laptop. Measured 2026-11-06 with
                             # tools/measure_latency.py: median 234 ms including motor spin-up.
  clearance_mm: 20           # extra clearance beyond the robot's own half-diagonal for path/geofence margins

sim:
  timestep_s: 0.002
  pose_noise_mm: 0.8         # std of tracked position noise
  heading_noise_rad: 0.01
  randomize: false           # domain randomization (friction, mass, motor gain, latency)
  randomization:             # the ranges drawn every episode when it is on (training uses it)
    latency_s: [0.15, 0.28]       # loop delay, s (measured median 0.234 s)
    deadzone_scale: [0.7, 1.3]    # x each wheel's dead zone
    motor_gain: [0.88, 1.12]      # x each wheel's speed per command (unmatched motors)
    pose_noise_mm: [0.3, 2.0]     # tracking noise, std
    friction_scale: [0.6, 1.3]    # x wheel friction
    mass_scale: [0.9, 1.25]       # x car mass

battery:
  cells: 2                   # 2S pack, reported by the car as total pack voltage
  nominal_mv: 7400
  compensate: true           # scale motor commands by nominal / measured voltage (constant speed as it drains)
