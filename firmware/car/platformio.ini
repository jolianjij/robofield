; RoboField car firmware - ESP32-C3 Super Mini, Arduino core 3.x (pioarduino platform)
;
; First flash, over USB (once per car):   pio run -e usb -t upload
; Every update after that, over WiFi:      pio run -e ota -t upload --upload-port robofield-car-0.local
;                                          (or the car's IP address)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I../common
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.0

[env:usb]

[env:ota]
upload_protocol = espota
upload_flags =
  --auth=robofield
  --port=3232
